<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Loghy — Web Demo</title>
<meta name="description" content="Browser demo of Loghy, the offline Socratic thinking partner." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="device" id="device">

  <!-- ------------------------------------------------------------- top bar -->
  <header class="topbar">
    <button class="idea raised" id="ideaBtn" title="Switch idea">
      <div class="t" id="ideaTitle">Select Idea</div>
      <div class="d" id="ideaDomain">Socratic</div>
    </button>
    <button class="btn icon" id="lockBtn" title="Lock app" aria-label="Lock app">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" />
      </svg>
    </button>
    <button class="btn icon" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7 5.4 5.4" />
      </svg>
    </button>
  </header>

  <!-- ----------------------------------------------------------- creature -->
  <div class="stage-head">
    <svg id="creature" width="130" height="130" viewBox="0 0 120 120" aria-label="Loghy"></svg>
    <div class="bubble raised" id="thoughtBubble" hidden></div>
  </div>

  <!-- ------------------------------------------------------------ screens -->
  <main class="screens">

    <!-- STAGE -->
    <section class="screen active" id="screen-stage">
      <div class="scroll" id="chatScroll"></div>
      <div class="chips" id="chips"></div>
      <div class="composer">
        <div class="field debossed">
          <input id="chatInput" type="text" placeholder="Pitch an idea, or ask something…" autocomplete="off" />
        </div>
        <button class="btn icon" id="sendBtn" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 12h15M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>
    </section>

    <!-- SWOT -->
    <section class="screen" id="screen-swot">
      <div class="scroll" id="swotScroll"></div>
    </section>

    <!-- LATERAL -->
    <section class="screen" id="screen-lateral">
      <div class="scroll" id="lateralScroll"></div>
    </section>

    <!-- SCHEDULE -->
    <section class="screen" id="screen-schedule">
      <div class="scroll" id="scheduleScroll"></div>
    </section>

    <!-- VAULT -->
    <section class="screen" id="screen-vault">
      <div class="scroll" id="vaultScroll"></div>
    </section>

  </main>

  <!-- ------------------------------------------------------------ tab bar -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- ------------------------------------------------------------ overlays -->
  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet">
      <div class="grab"></div>
      <div class="sheet-head">
        <h3 id="sheetTitle">Title</h3>
        <button class="btn icon" id="sheetClose" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- --------------------------------------------------------- lock screen -->
  <div class="lock" id="lockScreen">
    <svg id="lockCreature" width="96" height="96" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <div class="headline" style="margin-top:14px">Loghy</div>
    <div class="caption" id="lockSub">Brainstorming Vault Locked</div>
    <div class="dots" id="pinDots"></div>
    <div class="err" id="pinError"></div>
    <div class="keypad" id="keypad"></div>
  </div>

  <div class="toast raised" id="toast"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
